# Sized for this machine, not for a build server. The Flutter template ships
# -Xmx8G -XX:MaxMetaspaceSize=4G, which reserves ~12G of JVM heap on a 16G
# laptop with ~4-6G actually free; Windows killed profile builds outright for
# low memory. The AOT step (gen_snapshot) is the real spike in a
# profile/release build, so Gradle is kept deliberately small to leave it
# headroom, and the daemon is off so nothing stays resident between builds.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
