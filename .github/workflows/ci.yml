name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # clang builds the packages/tv_crypto native hook on the host; sqlite is
      # needed by sqflite_common_ffi in tests.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev

      - name: Get dependencies
        run: flutter pub get

      # The analyzer exits non-zero on info-level hints; the baseline has a few.
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Test (app)
        run: flutter test

      - name: Test (packages/tg)
        working-directory: packages/tg
        run: |
          dart pub get
          dart test

      - name: Test (packages/tv_core)
        working-directory: packages/tv_core
        run: |
          dart pub get
          dart test
